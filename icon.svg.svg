<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pozadí: Jemný přechod nebe -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="50%" stop-color="#2a5298" />
      <stop offset="100%" stop-color="#7e57c2" />
    </linearGradient>

    <!-- Slunce / Západ slunce -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#ff7043" />
    </radialGradient>

    <!-- Zadní hora -->
    <linearGradient id="mountainBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#455a64" />
      <stop offset="100%" stop-color="#263238" />
    </linearGradient>

    <!-- Hlavní hora (Milešovka) -->
    <linearGradient id="mountainFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388e3c" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>

    <!-- Stínování hory -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Základní tvar PWA ikonky se zaoblenými rohy (iOS style) -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Slunce -->
  <circle cx="256" cy="230" r="110" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Zadní horstvo -->
  <polygon points="60,400 210,230 330,400" fill="url(#mountainBackGrad)" opacity="0.7" />
  
  <!-- Hlavní hora (Milešovka) -->
  <polygon points="100,420 256,150 430,420" fill="url(#mountainFrontGrad)" />
  <!-- Pravý stín hory pro 3D efekt -->
  <polygon points="256,150 430,420 256,420" fill="url(#shadowGrad)" />

  <!-- Rozhledna / Stožár na vrcholu -->
  <rect x="252" y="120" width="8" height="30" fill="#ffffff" />
  <!-- Vlajka na vrcholku -->
  <polygon points="260,122 285,132 260,142" fill="#e53935" />

  <!-- Spodní tmavší pruh pro text -->
  <path d="M0 380 Q256 360 512 380 L512 400 A112 112 0 0 1 400 512 L112 512 A112 112 0 0 1 0 400 Z" fill="#0d2b11" opacity="0.85" />

  <!-- Text "MILEŠOVKA" -->
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="4">MILEŠOVKA</text>
</svg>